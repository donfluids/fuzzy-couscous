# 128^3 Gaussian energy-deposition blast (energy-conserving smooth IC) in a
# slip-wall chamber, matched to blast_128_slip_hyper6_fd.toml (same domain,
# walls, mu, hyper6) so the spectral character can be compared against the
# smooth_sphere/tophat blasts. Deposits E_B above ambient as a Gaussian of
# width sigma=r0; rho stays at ambient (energy-only deposition).
run_name = "blast_128_gauss_mt16"

[grid]
nx = 128
ny = 128
nz = 128
lx = 1.0
ly = 1.0
lz = 1.0
x0 = -0.5
y0 = -0.5
z0 = -0.5

[bc]
xlo = "slip_wall"
xhi = "slip_wall"
ylo = "slip_wall"
yhi = "slip_wall"
zlo = "slip_wall"
zhi = "slip_wall"

[ic]
type         = "gaussian_blast"
blast_energy = 28.0        # matched to smooth_sphere peak M_t ~1.64
r0           = 0.06        # Gaussian width sigma
rho_0        = 1.0
T_0          = 1.0
Y42_amp      = 0.2         # asymmetric (4,2) seed, same as smooth_sphere

[physics]
gamma        = 1.4
R            = 1.0
mu           = 5.0e-4
prandtl      = 0.71
bulk_visc    = 0.0
hyper_coeff  = 0.0
hyper6_coeff = 2.5e-14

[time]
cfl_hyperbolic = 0.3
cfl_viscous    = 0.25
t_end          = 0.06
dt_max         = 1.0
max_steps      = 8000

[filter]
enabled = false

[output]
out_dir          = "runs/out_blast_128_gauss_mt16"
snapshot_every   = 1000000
stats_every      = 20
checkpoint_every = 5000
write_spectra    = true
write_helmholtz  = true
