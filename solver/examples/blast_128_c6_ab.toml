# 128^3 spherical blast in a slip-wall chamber with nabla^6 FD hyperdissipation.
# Goal: see whether the post-shock turbulent state exhibits a k^{-5/3} inertial
# range under the higher-order FD dissipation we now have.
#
# Non-dimensional units: R = 1, gamma = 1.4, ambient rho_0 = 1, T_0 = 1, so
# ambient sound speed c_0 = sqrt(gamma R T) = sqrt(1.4) ~ 1.18. Blast region
# has T_B = 100 -> c_B ~ 11.83. dx = 1/128 ~ 7.8e-3 so dt_CFL = 0.3 * dx / c_B
# ~ 2e-4 initially; relaxes as the blast cools.
#
# nu6 = 2.5e-14 chosen so nu6 * k_max^6 ~ 100 (same Nyquist damping rate as the
# 128^3 TGV nabla^6 calibration). Stability: dt * nu6 * k_max^6 ~ 0.02, well
# under RK3 explicit limit (~2.5). k_max = pi/dx = pi * 128 ~ 402 rad / unit.
run_name = "blast_128_c6_ab"

[grid]
nx = 128
ny = 128
nz = 128
lx = 1.0
ly = 1.0
lz = 1.0
x0 = -0.5
y0 = -0.5
z0 = -0.5

[bc]
xlo = "slip_wall"
xhi = "slip_wall"
ylo = "slip_wall"
yhi = "slip_wall"
zlo = "slip_wall"
zhi = "slip_wall"

[ic]
type           = "smooth_sphere"
r0             = 0.1
rho_B          = 10.0
T_B            = 100.0
rho_0          = 1.0
T_0            = 1.0
Y42_amp        = 0.2          # asymmetric mode 4,2 perturbation to seed instability
tanh_thickness = 0.012        # ~ 1.5 dx at 128^3

[physics]
gamma        = 1.4
R            = 1.0
mu           = 5.0e-4         # Re ~ urms * L / nu ~ a few thousand post-blast
prandtl      = 0.71
bulk_visc    = 0.0
hyper_coeff  = 0.0
hyper6_coeff = 2.5e-14
# hyper_method defaults to "fd"

[time]
cfl_hyperbolic = 0.3
cfl_viscous    = 0.25
t_end          = 0.06
dt_max         = 1.0
max_steps      = 200000

[filter]
enabled = false

[output]
out_dir          = "runs/out_blast_128_c6_ab"
snapshot_every   = 1000000    # only the initial step-0 snapshot
stats_every      = 20
checkpoint_every = 5000
write_spectra    = true
write_helmholtz  = true
