# Reproduces Case 1 from Daniel (2025) Table 1:
#   chamber L = 50 cm, rho_B/rho_0 = 10, T_B/T_0 = 100, r_0/L = 0.093,
#   ambient air rho_0 = 1.225e-3 g/cm^3 = 1.225 kg/m^3, T_0 = 288.15 K,
#   E_B ~ 105 kJ (deposited as initial internal energy of the hot sphere).
# SI units throughout: kg, m, s, K, Pa.
run_name = "paper_case1"

[grid]
nx = 256
ny = 256
nz = 256
lx = 0.50
ly = 0.50
lz = 0.50
x0 = -0.25
y0 = -0.25
z0 = -0.25

[bc]
xlo = "slip_wall"
xhi = "slip_wall"
ylo = "slip_wall"
yhi = "slip_wall"
zlo = "slip_wall"
zhi = "slip_wall"

[ic]
type           = "smooth_sphere"
r0             = 0.0465                # 0.093 * L
rho_B          = 12.25                 # 10 * rho_0
T_B            = 28815.0               # 100 * T_0
rho_0          = 1.225
T_0            = 288.15
Y42_amp        = 0.2                   # paper's perturbation
tanh_thickness = 0.0029                # ~ 1.5 dx at 256^3

[physics]
gamma     = 1.4
R         = 287.05                     # J / (kg K) for dry air
mu        = 1.8e-5                     # Pa s; paper uses 1.8e-4 poise = 1.8e-5 Pa s
prandtl   = 0.71
bulk_visc = 0.0

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 0.04                  # 40 ms, covers several wall reflections
dt_max         = 1.0
max_steps      = 500000

[output]
out_dir         = "out_paper_case1"
snapshot_every  = 200
stats_every     = 10
write_spectra   = true
write_helmholtz = true
