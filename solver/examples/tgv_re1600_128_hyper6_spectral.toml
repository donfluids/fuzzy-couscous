# TGV Re=1600 on 128^3 with nabla^6 PSEUDOSPECTRAL hyperdissipation.
# Same coefficient and Nyquist-damping calibration as the FD nabla^6 run;
# the difference is that the spectral operator applies exact -nu6 |k|^6
# in Fourier space rather than a composed-Laplacian FD approximation.
run_name = "tgv_re1600_128_hyper6_spectral"

[grid]
nx = 128
ny = 128
nz = 128
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma        = 1.4
R            = 1.0
mu           = 6.25e-4
hyper_coeff  = 0.0
hyper6_coeff = 1.5e-9
hyper_method = "spectral"

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 12.0
dt_max         = 1.0
max_steps      = 100000

[filter]
enabled = false

[output]
out_dir          = "out_tgv128_hyper6_spectral"
snapshot_every   = 1000000
stats_every      = 50
checkpoint_every = 2000
write_spectra    = true
write_helmholtz  = true
