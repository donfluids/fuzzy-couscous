# 768^3 spherical blast, slip-wall chamber, nabla^6 FD hyperdissipation.
# Largest cube that fits this node's 251 GB (~204 GB). 8-cell diffused IC.
# Nondimensional units (R=1, gamma=1.4, ambient rho=1, T=1; blast T_B=100).
# dx = 1/768; tanh_thickness = 8*dx; hyper6 = 2.5e-14*(128/768)^6 (Nyquist
# damping rate held fixed across resolution).
run_name = "blast_768_thick"

[grid]
nx = 768
ny = 768
nz = 768
lx = 1.0
ly = 1.0
lz = 1.0
x0 = -0.5
y0 = -0.5
z0 = -0.5

[bc]
xlo = "slip_wall"
xhi = "slip_wall"
ylo = "slip_wall"
yhi = "slip_wall"
zlo = "slip_wall"
zhi = "slip_wall"

[ic]
type           = "smooth_sphere"
r0             = 0.1
rho_B          = 10.0
T_B            = 100.0
rho_0          = 1.0
T_0            = 1.0
Y42_amp        = 0.2
tanh_thickness = 0.010416666666666666   # 8 cells at 768^3

[physics]
gamma        = 1.4
R            = 1.0
mu           = 5.0e-4
prandtl      = 0.71
bulk_visc    = 0.0
hyper_coeff  = 0.0
hyper6_coeff = 5.358e-19

[time]
cfl_hyperbolic = 0.3
cfl_viscous    = 0.25
t_end          = 0.005
dt_max         = 1.0
max_steps      = 20000

[filter]
enabled = false

[output]
out_dir          = "runs/blast/out_blast_768_thick"
stats_dt         = 0.0005
spectra_dt       = 0.0005
checkpoint_dt    = 0.001
snapshot_every   = 1000000   # initial only; checkpoints carry full state
write_spectra    = true
write_helmholtz  = true
