# Short 256^3 TGV Re=1600 perf-validation config.
# Identical physics + IC to tgv_re1600_256_hyper2.toml, but capped at 300
# steps from t=0 with all I/O disabled so the wall-clock reflects pure
# compute + halo + Allreduce. Matches the baseline log
# out_tgv256_hyper2_run.t0_to_4.log (steps 0..1600) so KE and eps_sol can
# be compared line-by-line.
run_name = "tgv_re1600_256_hyper2_perf"

[grid]
nx = 256
ny = 256
nz = 256
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma       = 1.4
R           = 1.0
mu          = 6.25e-4
hyper_coeff = 1.5625e-6

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 1.0e30
dt_max         = 1.0
max_steps      = 300

[filter]
enabled = false

[output]
out_dir          = "out_tgv256_hyper2_perf"
snapshot_every   = 1000000
stats_every      = 50
checkpoint_every = 0
write_spectra    = false
write_helmholtz  = false
