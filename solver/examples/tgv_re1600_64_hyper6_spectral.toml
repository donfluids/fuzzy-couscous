# TGV Re=1600 on 64^3 with nabla^6 PSEUDOSPECTRAL hyperdissipation.
# Same coefficient as the FD nabla^6 run; this variant uses the exact
# Fourier multiplier (-nu6 |k|^6) instead of a composed-Laplacian FD form.
run_name = "tgv_re1600_64_hyper6_spectral"

[grid]
nx = 64
ny = 64
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma        = 1.4
R            = 1.0
mu           = 6.25e-4
hyper_coeff  = 0.0
hyper6_coeff = 2.44e-8
hyper_method = "spectral"

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 12.0
dt_max         = 1.0
max_steps      = 100000

[filter]
enabled = false

[output]
out_dir          = "out_tgv64_hyper6_spectral"
snapshot_every   = 1000000
stats_every      = 10
checkpoint_every = 2000
write_spectra    = true
write_helmholtz  = true
