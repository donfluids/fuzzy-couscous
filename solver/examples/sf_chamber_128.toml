# Two-gamma closed-chamber blast, IDENTICAL numerics to tnt_chamber_128.toml
# (slip walls, 128^3, mu=0, hyper6, LAD) but ideal-gas products at Atwood ~0.82
# instead of JWL TNT at ~0.999. Apples-to-apples solenoidal comparison.
run_name = "sf_chamber_128"

[grid]
nx = 128
ny = 128
nz = 128
lx = 1.0
ly = 1.0
lz = 1.0
x0 = -0.5
y0 = -0.5
z0 = -0.5

[bc]
xlo = "slip_wall"
xhi = "slip_wall"
ylo = "slip_wall"
yhi = "slip_wall"
zlo = "slip_wall"
zhi = "slip_wall"

[ic]
type           = "smooth_sphere"
r0             = 0.06
rho_B          = 10.0
T_B            = 100.0
rho_0          = 1.0
T_0            = 1.0
Y42_amp        = 0.2
tanh_thickness = 0.024        # ~3 dx at 128^3 (resolved contact)

[multifluid]
enabled = false
eos     = "two_gamma"
conservative = false
gamma_p = 1.25
rho_p   = 10.0
T_p     = 100.0
rho_a   = 1.0
T_a     = 1.0

[physics]
gamma        = 1.4
R            = 1.0
mu           = 0.0
prandtl      = 0.71
bulk_visc    = 0.0
hyper_coeff  = 0.0
hyper6_coeff = 2.5e-15

[afp]
enabled      = true
r_order      = 4
C_beta       = 1.0
C_kappa      = 0.01
C_D          = 0.05
disable_weno = false

[time]
cfl_hyperbolic = 0.3
cfl_viscous    = 0.25
t_end          = 0.5
dt_max         = 1.0
max_steps      = 200000

[filter]
enabled = false

[output]
out_dir          = "runs/chamber/out_sf_chamber_128"
stats_dt         = 0.002
spectra_dt       = 0.005
snapshot_dt      = 0.02
checkpoint_dt    = 0.05
write_spectra    = true
write_helmholtz  = true
