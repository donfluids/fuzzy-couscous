# Statistically stationary forced HIT, Re~few hundred. Spectral OU forcing
# in k in [1, 3], constant injection power eps = 0.1.  After ~5 eddy turn-
# over times u_rms equilibrates; mean(eps_total) ~ eps_target by the
# energy-balance theorem for HIT.
run_name = "hit_forced_64"

[grid]
nx = 64
ny = 64
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"        # any smooth, low-Mach IC will settle to the
                              # same statistical steady state under forcing

[physics]
gamma = 1.4
R     = 1.0
mu          = 6.25e-4
hyper_coeff = 2.5e-5

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 20.0
dt_max         = 1.0
max_steps      = 100000

[forcing]
enabled    = true
k_lo       = 1
k_hi       = 3
eps_target = 0.1
T_corr     = 1.0
seed       = 12345

[filter]
enabled = false

[output]
out_dir          = "runs/hit/out_hit_forced_64"
snapshot_every   = 50000
stats_every      = 50
write_spectra    = true
write_helmholtz  = true
