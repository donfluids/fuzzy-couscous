# TGV Re=1600 on 64^3 with nabla^6 FD hyperdissipation.
#   nu6 = nu4 / k_max^2 with k_max = 32, nu4 = 2.5e-5 (baseline 64^3)
#       = 2.5e-5 / 1024 ~ 2.44e-8
run_name = "tgv_re1600_64_hyper6_fd"

[grid]
nx = 64
ny = 64
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma        = 1.4
R            = 1.0
mu           = 6.25e-4
hyper_coeff  = 0.0
hyper6_coeff = 2.44e-8

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 12.0
dt_max         = 1.0
max_steps      = 100000

[filter]
enabled = false

[output]
out_dir          = "runs/tgv/out_tgv64_hyper6_fd"
snapshot_every   = 1000000
stats_every      = 10
checkpoint_every = 2000
write_spectra    = true
write_helmholtz  = true
