# Baseline: TGV Re=1600 on 32^3, no filter. Should blow up the same way the
# 64^3 did but ~16x faster. Confirms the failure mode is robust.
run_name = "tgv_re1600_32_nofilter"

[grid]
nx = 32
ny = 32
nz = 32
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma = 1.4
R     = 1.0
mu    = 6.25e-4

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 12.0
dt_max         = 1.0
max_steps      = 100000

[filter]
enabled = false

[output]
out_dir          = "runs/tgv/out_tgv32_nofilter"
snapshot_every   = 50000
stats_every      = 10
write_spectra    = true
write_helmholtz  = true
