# TGV Re=1600 64^3 hyperdissipation-corrected, capped at 30 steps with all
# I/O disabled. Used as half of the PGO training set
# (scaling/run_pgo_train.sh), to balance the Case 1 shocked-branch coverage
# with smooth-flow coverage of WENO5's central-difference branch.
run_name = "tgv_re1600_64_hyper2_pgo_train"

[grid]
nx = 64
ny = 64
nz = 64
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma       = 1.4
R           = 1.0
mu          = 6.25e-4
hyper_coeff = 2.5e-5

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 1.0e30
dt_max         = 1.0
max_steps      = 30

[filter]
enabled = false

[output]
out_dir          = "runs/tgv/out_tgv64_hyper2_pgo_train"
snapshot_every   = 1000000
stats_every      = 10
checkpoint_every = 0
write_spectra    = false
write_helmholtz  = false
