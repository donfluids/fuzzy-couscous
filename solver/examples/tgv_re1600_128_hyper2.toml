# TGV Re=1600 on 128^3 with Δx^2-scaled hyperdissipation:
#   ν_h(128) = ν_h(64) × (64/128)^2 = 2.5e-5 / 4 = 6.25e-6
# (same scaling rule used at 32 → 64 → 256 in the README).
run_name = "tgv_re1600_128_hyper2"

[grid]
nx = 128
ny = 128
nz = 128
lx = 6.283185307179586
ly = 6.283185307179586
lz = 6.283185307179586
x0 = 0.0
y0 = 0.0
z0 = 0.0

[bc]
xlo = "periodic"
xhi = "periodic"
ylo = "periodic"
yhi = "periodic"
zlo = "periodic"
zhi = "periodic"

[ic]
type = "taylor_green"

[physics]
gamma       = 1.4
R           = 1.0
mu          = 6.25e-4
hyper_coeff = 6.25e-6

[time]
cfl_hyperbolic = 0.4
cfl_viscous    = 0.25
t_end          = 12.0
dt_max         = 1.0
max_steps      = 100000

[filter]
enabled = false

[output]
out_dir          = "out_tgv128_hyper2"
snapshot_every   = 1000000          # only the initial step-0 snapshot
stats_every      = 50               # CSV + spectra dump cadence
checkpoint_every = 2000             # ~10 ckpts to t=12 at dt~6e-4
write_spectra    = true
write_helmholtz  = true
